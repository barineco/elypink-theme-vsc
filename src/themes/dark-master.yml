# ==============================================================================
# Elypink Dark Theme - Master Definition
# ==============================================================================

# ==============================================================================
# Syntax Colors
# ==============================================================================

# Syntax color anchors
SYN_COMMENT:      &SYN_COMMENT      '#A37FB7'

SYN_VARIABLE:     &SYN_VARIABLE     '#CA8AFF'

SYN_STRING:       &SYN_STRING       '#FFD47E'

SYN_NUMBER:       &SYN_NUMBER       '#21E05D'

SYN_ATTRIBUTE:    &SYN_ATTRIBUTE    '#F982F9'
SYN_CONSTANT:     &SYN_CONSTANT     '#FF83D1'
SYN_KEYWORD:      &SYN_KEYWORD      '#FF95D2'
SYN_OPERATOR:     &SYN_OPERATOR     '#FF94D1'
SYN_FUNCTION:     &SYN_FUNCTION     '#FF8CFF'

SYN_REGEXP:       &SYN_REGEXP       '#43BFEF'
SYN_CODE_INLINE:  &SYN_CODE_INLINE  '#51CCF2'
SYN_DECORATOR:    &SYN_DECORATOR    '#5DCDF2'
SYN_CLASS:        &SYN_CLASS        '#5EDCFF'
SYN_BRACKET:      &SYN_BRACKET      '#72C9EA'
SYN_PROPERTY:     &SYN_PROPERTY     '#7BE7FF'

SYN_TAG:          &SYN_TAG          '#FF76A3'
SYN_HEADING:      &SYN_HEADING      '#FF77A4'
SYN_KEYWORD_FLOW: &SYN_KEYWORD_FLOW '#FF85C6'

# ==============================================================================
# Semantic Colors (Git, brackets, etc.)
# ==============================================================================

SEMANTIC_GIT_ADDED: &SEMANTIC_GIT_ADDED '#00B721'
SEMANTIC_GIT_MODIFIED: &SEMANTIC_GIT_MODIFIED '#FFCC00'
SEMANTIC_GIT_DELETED: &SEMANTIC_GIT_DELETED '#FF0015'
SEMANTIC_GIT_UNTRACKED_FG: &SEMANTIC_GIT_UNTRACKED_FG '#D57BFF'
SEMANTIC_GIT_MODIFIED_FG: &SEMANTIC_GIT_MODIFIED_FG '#FF61D5'
SEMANTIC_GIT_DELETED_FG: &SEMANTIC_GIT_DELETED_FG '#FF747F'
DARK_GIT_IGNORED_FG: &DARK_GIT_IGNORED_FG '#DAA8C9C0'

# ==============================================================================
# Dark Theme UI Colors
# ==============================================================================

# Backgrounds
DARK_BG_PURE:               &DARK_BG_PURE               '#000000'
DARK_BG_L0:                 &DARK_BG_L0                 '#30292D'
DARK_BG_L1:                 &DARK_BG_L1                 '#2A1D25'
DARK_BG_L2:                 &DARK_BG_L2                 '#3E343A'
DARK_BG_SECTION:            &DARK_BG_SECTION            '#3A2C33'
DARK_BG_TITLEBAR_ACTIVE:    &DARK_BG_TITLEBAR_ACTIVE    '#3D2935'
DARK_BG_TITLEBAR_INACTIVE:  &DARK_BG_TITLEBAR_INACTIVE  '#402636'
DARK_BG_ACTIVITY:           &DARK_BG_ACTIVITY           '#1F171A'
DARK_BG_HOVER:              &DARK_BG_HOVER              '#3A2F34'
DARK_BG_ACTIVE:             &DARK_BG_ACTIVE             '#3D1A24'

# Borders
DARK_BORDER_PANEL: &DARK_BORDER_PANEL '#46383c'
DARK_BORDER_BASE: &DARK_BORDER_BASE '#24151b'
DARK_BORDER_FOCUS: &DARK_BORDER_FOCUS '#6b4454'
DARK_BORDER_TRANSPARENT: &DARK_BORDER_TRANSPARENT '#00000000'

# Indent guides
DARK_INDENT_BASE: &DARK_INDENT_BASE '#24151b'
DARK_INDENT_ACTIVE: &DARK_INDENT_ACTIVE '#3a2229'

# Toolbar
DARK_TOOLBAR_HOVER: &DARK_TOOLBAR_HOVER '#FF58B75B'

# Buttons
DARK_BUTTON_BG: &DARK_BUTTON_BG '#7e3652'
DARK_BUTTON_HOVER: &DARK_BUTTON_HOVER '#FF58B75B'

# Terminal sticky scroll
DARK_TERMINAL_STICKY: &DARK_TERMINAL_STICKY '#4a2531'
DARK_TERMINAL_STICKY_HOVER: &DARK_TERMINAL_STICKY_HOVER '#5e323f'

# Selection & Highlight
DARK_SELECTION_BASE: &DARK_SELECTION_BASE '#24000c'
DARK_SELECTION: &DARK_SELECTION '#FF58B730'
DARK_BRACKET_MATCH_BG: &DARK_BRACKET_MATCH_BG '#00000000'

# Accent colors
DARK_ACCENT_PRIMARY: &DARK_ACCENT_PRIMARY '#FF52A5'

# Scrollbar
DARK_SCROLLBAR: &DARK_SCROLLBAR '#FF58B730'
DARK_SCROLLBAR_HOVER: &DARK_SCROLLBAR_HOVER '#FF58B75B'

# Tabs & Toolbar
DARK_TAB_ACTIVE_BG: &DARK_TAB_ACTIVE_BG '#FF66AB19'

# Foregrounds
DARK_FG_PRIMARY: &DARK_FG_PRIMARY '#E5C0D9'
DARK_FG_SECONDARY: &DARK_FG_SECONDARY '#DAA2C8'
DARK_FG_ON_DARK: &DARK_FG_ON_DARK '#ffffff'
DARK_FG_UI_PRIMARY: &DARK_FG_UI_PRIMARY '#e8c9dc'
DARK_FG_UI_INACTIVE: &DARK_FG_UI_INACTIVE '#D28EAE'

# Input & Dropdown
DARK_INPUT_BG: &DARK_INPUT_BG '#1a1014'

# Terminal
DARK_TERMINAL_BG: &DARK_TERMINAL_BG '#41182C'
DARK_TERMINAL_FG: &DARK_TERMINAL_FG '#efc9dd'
DARK_TERMINAL_SELECTION: &DARK_TERMINAL_SELECTION '#2f7ea880'

# Terminal ANSI Colors
DARK_ANSI_BLACK: &DARK_ANSI_BLACK '#000000'
DARK_ANSI_RED: &DARK_ANSI_RED '#ff5baa'
DARK_ANSI_GREEN: &DARK_ANSI_GREEN '#00d600'
DARK_ANSI_YELLOW: &DARK_ANSI_YELLOW '#f3bb00'
DARK_ANSI_BLUE: &DARK_ANSI_BLUE '#00afff'
DARK_ANSI_MAGENTA: &DARK_ANSI_MAGENTA '#f56fff'
DARK_ANSI_CYAN: &DARK_ANSI_CYAN '#00e6e6'
DARK_ANSI_WHITE: &DARK_ANSI_WHITE '#f5f5f5'
DARK_ANSI_BRIGHT_BLACK: &DARK_ANSI_BRIGHT_BLACK '#232323'
DARK_ANSI_BRIGHT_RED: &DARK_ANSI_BRIGHT_RED '#FF87C2'
DARK_ANSI_BRIGHT_GREEN: &DARK_ANSI_BRIGHT_GREEN '#62ff62'
DARK_ANSI_BRIGHT_YELLOW: &DARK_ANSI_BRIGHT_YELLOW '#fcd74f'
DARK_ANSI_BRIGHT_BLUE: &DARK_ANSI_BRIGHT_BLUE '#54d4ff'
DARK_ANSI_BRIGHT_MAGENTA: &DARK_ANSI_BRIGHT_MAGENTA '#F98FFF'
DARK_ANSI_BRIGHT_CYAN: &DARK_ANSI_BRIGHT_CYAN '#60ffff'

# ==============================================================================
# Theme Definition
# ==============================================================================

