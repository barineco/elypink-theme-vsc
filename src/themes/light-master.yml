  textLink.activeForeground: *LIGHT_ACCENT_PRIMARY
  selection.background: *LIGHT_SCROLLBAR
  progressBar.background: *LIGHT_ACCENT_PRIMARY
  statusBarItem.activeForeground: *LIGHT_ACCENT_PRIMARY
  editor.findRangeHighlightBackground: *LIGHT_SELECTION
  searchEditor.findMatchBackground: *LIGHT_SELECTION

tokenColors:

# ==============================================================================
# General
# ==============================================================================

  - name: Font style emphasis
    scope:
      - emphasis
    settings:
      fontStyle: italic

  - name: Font style strong
    scope:
      - strong
    settings:
      fontStyle: bold

  - name: Invalid
    scope:
      - invalid
    settings:
      foreground: *SYN_TAG
      fontStyle: underline italic

  - name: Invalid deprecated
    scope:
      - invalid.deprecated
    settings:
      foreground: *LIGHT_FG_PRIMARY
      fontStyle: underline italic

# ==============================================================================
# Diffs
# ==============================================================================

  - name: Diff meta
    scope:
      - meta.diff
      - meta.diff.header
    settings:
      foreground: *SYN_COMMENT

  - name: Diff inserted
    scope:
      - markup.inserted
    settings:
      foreground: *SEMANTIC_GIT_ADDED

  - name: Diff deleted
    scope:
      - markup.deleted
    settings:
      foreground: *SEMANTIC_GIT_DELETED

  - name: Diff changed
    scope:
      - markup.changed
    settings:
      foreground: *SEMANTIC_GIT_MODIFIED

# ==============================================================================
# Markdown / RST / Prose
# ==============================================================================

  - name: Markup underline
    scope:
      - markup.underline
    settings:
      fontStyle: underline

  - name: Markup bold
    scope:
      - markup.bold
    settings:
      fontStyle: bold

  - name: Markup headings
    scope:
      - markup.heading
    settings:
      foreground: *SYN_HEADING
      fontStyle: bold

  - name: Markup italic
    scope:
      - markup.italic
    settings:
      fontStyle: italic

  - name: Bullets, lists (prose)
    scope:
      - beginning.punctuation.definition.list.markdown
      - beginning.punctuation.definition.quote.markdown
      - punctuation.definition.link.restructuredtext
    settings:
      foreground: *SYN_OPERATOR

  - name: Inline code (prose)
    scope:
      - markup.inline.raw
      - markup.raw.restructuredtext
    settings:
      foreground: *SYN_CODE_INLINE

  - name: Links (prose)
    scope:
      - markup.underline.link
      - markup.underline.link.image
    settings:
      foreground: *SYN_PROPERTY

  - name: Link text, image alt text (prose)
    scope:
      - meta.link.reference.def.restructuredtext
      - punctuation.definition.directive.restructuredtext
      - string.other.link.description
      - string.other.link.title
    settings:
      foreground: *SYN_FUNCTION

  - name: Blockquotes (prose)
    scope:
      - entity.name.directive.restructuredtext
      - markup.quote
    settings:
      foreground: *SYN_STRING
      fontStyle: italic

  - name: Horizontal rule (prose)
    scope:
      - meta.separator.markdown
    settings:
      foreground: *SYN_COMMENT

  - name: Code blocks
    scope:
      - fenced_code.block.language
      - markup.raw.inner.restructuredtext
      - markup.fenced_code.block.markdown punctuation.definition.markdown
    settings:
      foreground: *SYN_CODE_INLINE

  - name: Prose constants
    scope:
      - punctuation.definition.constant.restructuredtext
    settings:
      foreground: *SYN_CONSTANT

# ==============================================================================
# Comments
# ==============================================================================

  - name: Comments
    scope:
      - comment
      - punctuation.definition.comment
      - unused.comment
      - wildcard.comment
    settings:
      foreground: *SYN_COMMENT
      fontStyle: italic

  - name: JSDoc-style keywords
    scope:
      - comment keyword.codetag.notation
      - comment.block.documentation keyword
      - comment.block.documentation storage.type.class
    settings:
      foreground: *SYN_FUNCTION

  - name: JSDoc-style types
    scope:
      - comment.block.documentation entity.name.type
    settings:
      foreground: *SYN_CLASS
      fontStyle: italic

  - name: JSDoc-style type brackets
    scope:
      - comment.block.documentation entity.name.type punctuation.definition.bracket
    settings:
      foreground: *SYN_CLASS

  - name: JSDoc-style comment parameters
    scope:
      - comment.block.documentation variable
    settings:
      foreground: *SYN_STRING
      fontStyle: italic

# ==============================================================================
# Constants
# ==============================================================================

  - name: Constants
    scope:
      - constant
      - constant.language
      - variable.other.constant
    settings:
      foreground: *SYN_CONSTANT

  - name: Numeric constants
    scope:
      - constant.numeric
    settings:
      foreground: *SYN_NUMBER

  - name: Character escape sequences
    scope:
      - constant.character.escape
    settings:
      foreground: *SYN_NUMBER

# ==============================================================================
# Classes
# ==============================================================================

  - name: User-defined class names
    scope:
      - entity.name.type.class
      - entity.name.class
    settings:
      foreground: *SYN_CLASS

  - name: User-defined class names support
    scope:
      - support.class
    settings:
      foreground: *SYN_CLASS
      fontStyle: italic

  - name: this, super, self, etc.
    scope:
      - keyword.expressions-and-types.swift
      - keyword.other.this
      - variable.language
      - variable.language punctuation.definition.variable.php
      - variable.other.readwrite.instance.ruby
      - variable.parameter.function.language.special
    settings:
      foreground: *SYN_VARIABLE
      fontStyle: italic

  - name: Inherited classes
    scope:
      - entity.other.inherited-class
    settings:
      foreground: *SYN_CLASS
      fontStyle: italic

# ==============================================================================
# Functions/Methods
# ==============================================================================

  - name: Function names
    scope:
      - entity.name.function
      - meta.function-call.object
      - meta.function-call.php
      - meta.function-call.static
      - meta.method-call.java meta.method
      - meta.method.groovy
      - support.function.any-method.lua
      - keyword.operator.function.infix
    settings:
      foreground: *SYN_FUNCTION

  - name: Support functions
    scope:
      - support.function
    settings:
      foreground: *SYN_FUNCTION
      fontStyle: italic

  - name: Function parameters
    scope:
      - entity.name.variable.parameter
      - meta.at-rule.function variable
      - meta.at-rule.mixin variable
      - meta.function.arguments variable.other.php
      - meta.selectionset.graphql meta.arguments.graphql variable.arguments.graphql
      - variable.parameter
    settings:
      foreground: *SYN_VARIABLE
      fontStyle: italic

  - name: Decorators
    scope:
      - meta.decorator variable.other.readwrite
      - meta.decorator variable.other.property
      - meta.decorator variable.other.object
    settings:
      foreground: *SYN_DECORATOR
      fontStyle: italic

  - name: Decorator punctuation
    scope:
      - meta.decorator punctuation.decorator
      - punctuation.decorator
    settings:
      foreground: *SYN_DECORATOR

# ==============================================================================
# Keywords
# ==============================================================================

  - name: Keywords
    scope:
      - keyword
      - punctuation.definition.keyword
    settings:
      foreground: *SYN_KEYWORD

  - name: Control flow keywords
    scope:
      - keyword.control
    settings:
      foreground: *SYN_KEYWORD_FLOW

  - name: Keyword "new"
    scope:
      - keyword.control.new
      - keyword.operator.new
    settings:
      foreground: *SYN_KEYWORD
      fontStyle: bold

# ==============================================================================
# Language Built-ins
# ==============================================================================

  - name: Language Built-ins
    scope:
      - support
    settings:
      foreground: *SYN_CLASS
      fontStyle: italic

  - name: Built-in magic functions and constants
    scope:
      - support.function.magic
      - support.variable
      - variable.other.predefined
    settings:
      foreground: *SYN_VARIABLE

  - name: Built-in functions / properties
    scope:
      - support.function.builtin
      - support.type.property-name.json
    settings:
      foreground: *SYN_FUNCTION
      fontStyle: italic

# ==============================================================================
# Variables
# ==============================================================================

  - name: Variables
    scope:
      - variable
      - variable.other.readwrite
    settings:
      foreground: *SYN_VARIABLE

  - name: Object properties
    scope:
      - variable.other.property
      - variable.other.object.property
    settings:
      foreground: *SYN_PROPERTY

  - name: Properties (support)
    scope:
      - support.type.property-name
    settings:
      foreground: *SYN_PROPERTY

# ==============================================================================
# Storage
# ==============================================================================

  - name: Storage type
    scope:
      - storage.type
    settings:
      foreground: *SYN_KEYWORD

  - name: Storage modifier
    scope:
      - storage.modifier
    settings:
      foreground: *SYN_KEYWORD

# ==============================================================================
# Operators
# ==============================================================================

  - name: Operators
    scope:
      - keyword.operator
    settings:
      foreground: *SYN_OPERATOR

# ==============================================================================
# Strings
# ==============================================================================

  - name: Strings
    scope:
      - string
      - string.quoted
      - punctuation.definition.string
    settings:
      foreground: *SYN_STRING

  - name: Template strings
    scope:
      - string.template
      - punctuation.definition.string.template
    settings:
      foreground: *SYN_STRING

# ==============================================================================
# Punctuation
# ==============================================================================

  - name: Brackets
    scope:
      - meta.brace
      - punctuation.section.brackets
      - punctuation.section.parens
    settings:
      foreground: *SYN_BRACKET

  - name: Separators (commas, semicolons)
    scope:
      - punctuation.separator
      - punctuation.terminator
    settings:
      foreground: *LIGHT_FG_PRIMARY

# ==============================================================================
# Entities (HTML, CSS, etc.)
# ==============================================================================

  - name: HTML tags
    scope:
      - entity.name.tag
    settings:
      foreground: *SYN_TAG

  - name: CSS attribute parent selectors ('&')
    scope:
      - entity.other.attribute-name.parent-selector
    settings:
      foreground: *SYN_TAG

  - name: HTML/CSS attribute names
    scope:
      - entity.other.attribute-name
    settings:
      foreground: *SYN_ATTRIBUTE

  - name: HTML/CSS ids
    scope:
      - entity.other.attribute-name.id
    settings:
      foreground: *SYN_CLASS
      fontStyle: italic

  - name: CSS class selectors
    scope:
      - entity.other.attribute-name.class
    settings:
      foreground: *SYN_CLASS

  - name: CSS pseudo-class
    scope:
      - entity.other.attribute-name.pseudo-class
      - entity.other.attribute-name.pseudo-element
    settings:
      foreground: *SYN_DECORATOR

  - name: Generic selectors (CSS/SCSS/Less/Stylus)
    scope:
      - meta.selector
    settings:
      foreground: *SYN_TAG

# ==============================================================================
# RegExp
# ==============================================================================

  - name: Regular expressions
    scope:
      - string.regexp
    settings:
      foreground: *SYN_REGEXP

  - name: RegExp operators
    scope:
      - keyword.operator.quantifier.regexp
      - keyword.operator.or.regexp
    settings:
      foreground: *SYN_REGEXP

# ==============================================================================
# Serializable / Config Languages (JSON, YAML, TOML, etc.)
# ==============================================================================

  - name: JSON keys
    scope:
      - support.type.property-name.json
      - meta.structure.dictionary.key.json string.quoted
    settings:
      foreground: *SYN_FUNCTION

  - name: YAML keys
    scope:
      - entity.name.tag.yaml
    settings:
      foreground: *SYN_FUNCTION

  - name: TOML keys
    scope:
      - entity.name.tag.toml
      - support.type.property-name.toml
    settings:
      foreground: *SYN_FUNCTION

  - name: INI keys
    scope:
      - keyword.other.definition.ini
    settings:
      foreground: *SYN_FUNCTION

# ==============================================================================
# Language Extensions / Edge Cases
# ==============================================================================

  # JavaScript / TypeScript
  # =======================

  - name: JS/TS object literal keys (frequent)
    scope:
      - meta.object-literal.key.js
      - meta.object-literal.key.ts
      - meta.object-literal.key.jsx
      - meta.object-literal.key.tsx
    settings:
      foreground: *SYN_FUNCTION

  - name: JS/TS object properties (frequent)
    scope:
      - variable.other.property.js
      - variable.other.property.ts
      - variable.other.property.jsx
      - variable.other.property.tsx
      - variable.other.object.property.js
      - variable.other.object.property.ts
    settings:
      foreground: *SYN_PROPERTY

  - name: JS/TS destructuring variables
    scope:
      - meta.object-binding-pattern-variable.js
      - meta.object-binding-pattern-variable.ts
    settings:
      foreground: *SYN_VARIABLE

  - name: JS/TS type annotations
    scope:
      - meta.type.annotation entity.name.type
      - meta.type.parameters entity.name.type
    settings:
      foreground: *SYN_CLASS

  - name: JS/TS template expression braces
    scope:
      - punctuation.definition.template-expression.begin
      - punctuation.definition.template-expression.end
    settings:
      foreground: *SYN_OPERATOR

  - name: JSX component names
    scope:
      - support.class.component.js
      - support.class.component.tsx
      - entity.name.tag.js
      - entity.name.tag.tsx
    settings:
      foreground: *SYN_TAG

  - name: JSX embedded expressions
    scope:
      - punctuation.section.embedded.begin.jsx
      - punctuation.section.embedded.end.jsx
      - punctuation.section.embedded.begin.tsx
      - punctuation.section.embedded.end.tsx
    settings:
      foreground: *LIGHT_FG_PRIMARY

  # Python
  # ======

  - name: Python function decorators
    scope:
      - meta.function.decorator.python
      - entity.name.function.decorator.python
    settings:
      foreground: *SYN_DECORATOR

  - name: Python special methods (dunder)
    scope:
      - support.function.magic.python
    settings:
      foreground: *SYN_DECORATOR
      fontStyle: italic

  - name: Python type hints
    scope:
      - meta.function.parameters.python support.type
      - meta.function.return-type.python support.type
    settings:
      foreground: *SYN_CLASS

  - name: Python self parameter
    scope:
      - variable.parameter.function.language.special.self.python
    settings:
      foreground: *SYN_VARIABLE
      fontStyle: italic

  # CSS / SCSS / Less
  # ==================

  - name: CSS property names
    scope:
      - support.type.property-name.css
      - support.type.property-name.scss
      - support.type.property-name.less
    settings:
      foreground: *SYN_PROPERTY

  - name: CSS units
    scope:
      - keyword.other.unit.css
      - keyword.other.unit.scss
      - keyword.other.unit.less
    settings:
      foreground: *SYN_NUMBER

  - name: CSS functions
    scope:
      - support.function.misc.css
      - support.function.misc.scss
    settings:
      foreground: *SYN_FUNCTION

  - name: SCSS variables
    scope:
      - variable.scss
      - variable.sass
    settings:
      foreground: *SYN_VARIABLE

  - name: SCSS attribute selector strings
    scope:
      - meta.attribute-selector.scss
    settings:
      foreground: *SYN_STRING

  - name: SCSS attribute selector brackets
    scope:
      - punctuation.definition.attribute-selector.end.bracket.square.scss
      - punctuation.definition.attribute-selector.begin.bracket.square.scss
    settings:
      foreground: *LIGHT_FG_PRIMARY

  # GraphQL
  # =======

  - name: GraphQL keys
    scope:
      - meta.selectionset.graphql variable
    settings:
      foreground: *SYN_PROPERTY

  - name: GraphQL function arguments
    scope:
      - meta.selectionset.graphql meta.arguments variable
    settings:
      foreground: *SYN_VARIABLE

  - name: GraphQL fragment name
    scope:
      - entity.name.fragment.graphql
      - variable.fragment.graphql
    settings:
      foreground: *SYN_CLASS

  # Ruby
  # ====

  - name: Ruby backticks literal
    scope:
      - string.interpolated.ruby
    settings:
      foreground: *SYN_STRING

  - name: Ruby Hash symbol keys
    scope:
      - constant.other.symbol.hashkey
      - constant.other.symbol.hashkey.ruby
      - constant.other.symbol.hashkey.parameter.function.ruby
      - constant.language.symbol.hashkey.ruby
    settings:
      foreground: *SYN_PROPERTY

  # Shell / Bash
  # ============

  - name: Shell variables prefixed with "$"
    scope:
      - source.shell variable.other
    settings:
      foreground: *SYN_VARIABLE

  - name: Shell command names
    scope:
      - meta.function-call.shell
    settings:
      foreground: *SYN_FUNCTION

  # Go
  # ==

  - name: Go package names
    scope:
      - entity.name.package.go
    settings:
      foreground: *SYN_CLASS

  - name: Go function calls
    scope:
      - meta.function-call.go
    settings:
      foreground: *SYN_FUNCTION

  # Rust
  # ====

  - name: Rust attributes
    scope:
      - meta.attribute.rust
    settings:
      foreground: *SYN_DECORATOR

  - name: Rust lifetimes
    scope:
      - storage.modifier.lifetime.rust
      - entity.name.lifetime.rust
    settings:
      foreground: *SYN_DECORATOR

  - name: Rust macros
    scope:
      - entity.name.function.macro.rust
    settings:
      foreground: *SYN_DECORATOR

  # PHP
  # ===

  - name: PHP variables
    scope:
      - variable.other.php punctuation.definition.variable.php
    settings:
      foreground: *SYN_VARIABLE

  # SQL
  # ===

  - name: SQL keywords
    scope:
      - keyword.other.sql
    settings:
      foreground: *SYN_KEYWORD

  # Makefile
  # ========

  - name: Makefile prerequisite names
    scope:
      - meta.scope.prerequisites.makefile
    settings:
      foreground: *SYN_STRING

  # Haskell
  # =======

  - name: Haskell pragmas
    scope:
      - meta.preprocessor.haskell
    settings:
      foreground: *SYN_COMMENT

  # Log files
  # =========

  - name: Log file error
    scope:
      - log.error
    settings:
      foreground: *SEMANTIC_GIT_DELETED
      fontStyle: bold

  - name: Log file warning
    scope:
      - log.warning
    settings:
      foreground: *SEMANTIC_GIT_MODIFIED
      fontStyle: bold

  # Edge Cases (foreground resets)
  # ===============================

  - name: Edge cases (foreground color resets)
    scope:
      - keyword.operator.dereference.java
      - keyword.operator.navigation.groovy
      - meta.scope.for-loop.shell punctuation.definition.string.begin
      - meta.scope.for-loop.shell punctuation.definition.string.end
      - meta.scope.for-loop.shell string
      - storage.modifier.import
      - punctuation.separator.list.comma.css
      - constant.language.empty-list.haskell
    settings:
      foreground: *LIGHT_FG_PRIMARY

  - name: Powershell constants
    scope:
      - support.constant
    settings:
      foreground: *SYN_CONSTANT
