# ==============================================================================
# Elypink Light Theme - Master Definition
# ==============================================================================

# ==============================================================================
# Syntax Colors
# ==============================================================================

# Syntax color anchors
SYN_COMMENT:      &SYN_COMMENT      '#A37FB7'

SYN_VARIABLE:     &SYN_VARIABLE     '#B256FE'

SYN_STRING:       &SYN_STRING       '#ED6700'

SYN_NUMBER:       &SYN_NUMBER       '#00A535'

SYN_ATTRIBUTE:    &SYN_ATTRIBUTE    '#EC3BEC'
SYN_CONSTANT:     &SYN_CONSTANT     '#F221A5'
SYN_KEYWORD:      &SYN_KEYWORD      '#FD3CAB'
SYN_OPERATOR:     &SYN_OPERATOR     '#FF39A9'
SYN_FUNCTION:     &SYN_FUNCTION     '#D100D1'

SYN_REGEXP:       &SYN_REGEXP       '#0F8CBC'
SYN_CODE_INLINE:  &SYN_CODE_INLINE  '#0090BC'
SYN_DECORATOR:    &SYN_DECORATOR    '#0490BF'
SYN_CLASS:        &SYN_CLASS        '#009CC7'
SYN_BRACKET:      &SYN_BRACKET      '#2C90B7'
SYN_PROPERTY:     &SYN_PROPERTY     '#009CBF'

SYN_TAG:          &SYN_TAG          '#F23876'
SYN_HEADING:      &SYN_HEADING      '#F2568A'
SYN_KEYWORD_FLOW: &SYN_KEYWORD_FLOW '#E5007A'

# ==============================================================================
# Semantic Colors (Git, brackets, etc.)
# ==============================================================================

SEMANTIC_GIT_ADDED: &SEMANTIC_GIT_ADDED '#00B721'
SEMANTIC_GIT_MODIFIED: &SEMANTIC_GIT_MODIFIED '#E3BD01'
SEMANTIC_GIT_DELETED: &SEMANTIC_GIT_DELETED '#FF0015'
SEMANTIC_GIT_UNTRACKED_FG: &SEMANTIC_GIT_UNTRACKED_FG '#9619FE'
SEMANTIC_GIT_MODIFIED_FG: &SEMANTIC_GIT_MODIFIED_FG '#B900B9'
SEMANTIC_GIT_DELETED_FG: &SEMANTIC_GIT_DELETED_FG '#CB006C'
LIGHT_GIT_IGNORED_FG: &LIGHT_GIT_IGNORED_FG '#9A6185c0'

# ==============================================================================
# Light Theme UI Colors
# ==============================================================================

# Backgrounds
LIGHT_BG_PURE:              &LIGHT_BG_PURE              '#ffffff'
LIGHT_BG_L0:                &LIGHT_BG_L0                '#f9eef3'
LIGHT_BG_L1:                &LIGHT_BG_L1                '#edd8e1'
LIGHT_BG_L2:                &LIGHT_BG_L2                '#F7E3EC'
LIGHT_BG_SECTION:           &LIGHT_BG_SECTION           '#EBC4D1'
LIGHT_BG_HOVER:             &LIGHT_BG_HOVER             '#E6BDCD'
LIGHT_BG_TITLEBAR_ACTIVE:   &LIGHT_BG_TITLEBAR_ACTIVE   '#E5ABC4'
LIGHT_BG_TITLEBAR_INACTIVE: &LIGHT_BG_TITLEBAR_INACTIVE '#DFB1C0'
LIGHT_BG_ACTIVE:            &LIGHT_BG_ACTIVE            '#D08AA7'

# Borders
LIGHT_BORDER_PANEL: &LIGHT_BORDER_PANEL '#c49baf'
LIGHT_BORDER_BASE: &LIGHT_BORDER_BASE '#e0c9d3'
LIGHT_BORDER_FOCUS: &LIGHT_BORDER_FOCUS '#fabdd5'
LIGHT_BORDER_TRANSPARENT: &LIGHT_BORDER_TRANSPARENT '#ffffff00'

# Indent guides
LIGHT_INDENT_BASE: &LIGHT_INDENT_BASE '#e0c9d3'
LIGHT_INDENT_ACTIVE: &LIGHT_INDENT_ACTIVE '#d8bbca'

# Toolbar
LIGHT_TOOLBAR_HOVER: &LIGHT_TOOLBAR_HOVER '#FF58B75B'

# Buttons
LIGHT_BUTTON_BG: &LIGHT_BUTTON_BG '#b26c89'
LIGHT_BUTTON_HOVER: &LIGHT_BUTTON_HOVER '#FF58B75B'

# Terminal sticky scroll
LIGHT_TERMINAL_STICKY: &LIGHT_TERMINAL_STICKY '#82425a'
LIGHT_TERMINAL_STICKY_HOVER: &LIGHT_TERMINAL_STICKY_HOVER '#97546e'

# Selection & Highlight
LIGHT_SELECTION_BASE: &LIGHT_SELECTION_BASE '#e06d93'
LIGHT_SELECTION: &LIGHT_SELECTION '#FF58B730'
LIGHT_BRACKET_MATCH_BG: &LIGHT_BRACKET_MATCH_BG '#00000000'

# Accent colors
LIGHT_ACCENT_PRIMARY: &LIGHT_ACCENT_PRIMARY '#D83375'

# Scrollbar
LIGHT_SCROLLBAR: &LIGHT_SCROLLBAR '#FF58B730'
LIGHT_SCROLLBAR_HOVER: &LIGHT_SCROLLBAR_HOVER '#FF58B75B'

# Tabs & Toolbar
LIGHT_TAB_ACTIVE_BG: &LIGHT_TAB_ACTIVE_BG '#FFCAE2AA'

# Foregrounds
LIGHT_FG_PRIMARY: &LIGHT_FG_PRIMARY '#735B6A'
LIGHT_FG_SECONDARY: &LIGHT_FG_SECONDARY '#B67491'
LIGHT_FG_ON_DARK: &LIGHT_FG_ON_DARK '#ffffff'
LIGHT_FG_UI_PRIMARY: &LIGHT_FG_UI_PRIMARY '#4d404a'
LIGHT_FG_UI_INACTIVE: &LIGHT_FG_UI_INACTIVE '#8F5D78'

# Terminal
LIGHT_TERMINAL_BG: &LIGHT_TERMINAL_BG '#8E375E'
LIGHT_TERMINAL_FG: &LIGHT_TERMINAL_FG '#ffe0eb'
LIGHT_TERMINAL_SELECTION: &LIGHT_TERMINAL_SELECTION '#499de080'

# Terminal ANSI Colors
LIGHT_ANSI_BLACK: &LIGHT_ANSI_BLACK '#000000'
LIGHT_ANSI_RED: &LIGHT_ANSI_RED '#ff72b9'
LIGHT_ANSI_GREEN: &LIGHT_ANSI_GREEN '#00dd00'
LIGHT_ANSI_YELLOW: &LIGHT_ANSI_YELLOW '#f5c400'
LIGHT_ANSI_BLUE: &LIGHT_ANSI_BLUE '#00bfff'
LIGHT_ANSI_MAGENTA: &LIGHT_ANSI_MAGENTA '#f78bff'
LIGHT_ANSI_CYAN: &LIGHT_ANSI_CYAN '#00efef'
LIGHT_ANSI_WHITE: &LIGHT_ANSI_WHITE '#f8f8f8'
LIGHT_ANSI_BRIGHT_BLACK: &LIGHT_ANSI_BRIGHT_BLACK '#2C2C2C'
LIGHT_ANSI_BRIGHT_RED: &LIGHT_ANSI_BRIGHT_RED '#ff83c1'
LIGHT_ANSI_BRIGHT_GREEN: &LIGHT_ANSI_BRIGHT_GREEN '#73ff73'
LIGHT_ANSI_BRIGHT_YELLOW: &LIGHT_ANSI_BRIGHT_YELLOW '#fee16b'
LIGHT_ANSI_BRIGHT_BLUE: &LIGHT_ANSI_BRIGHT_BLUE '#72dcff'
LIGHT_ANSI_BRIGHT_MAGENTA: &LIGHT_ANSI_BRIGHT_MAGENTA '#f89cff'
LIGHT_ANSI_BRIGHT_CYAN: &LIGHT_ANSI_BRIGHT_CYAN '#78ffff'

# ==============================================================================
# Theme Definition
# ==============================================================================

